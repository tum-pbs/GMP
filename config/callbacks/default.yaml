callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${trainer.default_root_dir}/checkpoints
    monitor: fit/val/loss
    mode: min
    save_top_k: 1
    save_last: true
    filename: "best"
    auto_insert_metric_name: false
  ema:
    _target_: src.callbacks.EMACallback
    dirpath: ${trainer.default_root_dir}/checkpoints-ema
    decay: 0.999
    ema_device: null
    use_ema_for_test: ${use_ema_for_test}
  learning_rate_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: epoch
    log_momentum: True
    log_weight_decay: True
  progress_logger:
    _target_: src.callbacks.ProgressLoggingCallback
    log_every_n_steps: ${trainer.log_every_n_steps}




