defaults:
  - data: crash_autoregressive
  - model: gmpnet_crasht_scratch
  - module: unstructured_autoregressive
  - trainer: default
  - callbacks: [default, unstructured_rollout_3d_vis, model_stats]
  - optimizer: lion
  - wandb: autoreg
  - hydra: default
  - env: servus06
  - _self_


#### Name of run and seed ####

seed: 0
name: gmpnet_crasht_scratch
run_id: null

#### Output directory ####
log_dir: outputs/

#### Batch size computation ####

batch_size: 4
max_batch_size_per_gpu: 4

nodes: ${env.nodes}
devices: ${env.devices}
effective_batch_size_per_gpu: ${eval:'int(${batch_size}/(${nodes}*${devices}))'}
batch_size_per_gpu: ${eval:'min(${max_batch_size_per_gpu}, ${effective_batch_size_per_gpu})'}
gradient_accumulation_steps: ${eval:'int(${effective_batch_size_per_gpu} / ${batch_size_per_gpu})'}

#### Learning rate and number of epochs ####

learning_rate: 1e-5
max_epochs: 20
warmup_epochs: 2
weight_decay: 1e-2
gradient_clip_val: 1.0

#### EMA settings ####

use_ema_for_test: true


#### Experiment settings ####
use_surface: true
use_volume: false
max_num_surface_points: 32768
max_num_volume_points: 32768
dim: 3

